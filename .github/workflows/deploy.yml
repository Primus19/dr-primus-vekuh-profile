name: Deploy to AWS S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy Static Site to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync HTML files to S3
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude ".gitignore" \
            --cache-control "public, max-age=3600" \
            --exclude "*" \
            --include "*.html"

      - name: Sync all other files to S3
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude ".gitignore" \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000"

      - name: Set correct content types
        run: |
          # Set content type for CSS files
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/css/ s3://${{ secrets.S3_BUCKET_NAME }}/css/ \
            --recursive \
            --content-type "text/css" \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=31536000" || true

          # Set content type for JS files
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/js/ s3://${{ secrets.S3_BUCKET_NAME }}/js/ \
            --recursive \
            --content-type "application/javascript" \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=31536000" || true

          # Set content type for HTML files
          aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --content-type "text/html; charset=utf-8" \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=3600" || true

          # Set content type for images
          for ext in jpg jpeg png gif webp svg; do
            aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/images/ s3://${{ secrets.S3_BUCKET_NAME }}/images/ \
              --recursive \
              --exclude "*" \
              --include "*.$ext" \
              --content-type "image/$ext" \
              --metadata-directive REPLACE \
              --cache-control "public, max-age=31536000" || true
          done

      - name: Deployment summary
        run: |
          echo "============================================"
          echo "  Deployment Complete!"
          echo "============================================"
          echo ""
          echo "  S3 Bucket: ${{ secrets.S3_BUCKET_NAME }}"
          echo "  Region: ${{ env.AWS_REGION }}"
          echo ""
          echo "  Website URL:"
          echo "  http://${{ secrets.S3_BUCKET_NAME }}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
          echo ""
          echo "============================================"
